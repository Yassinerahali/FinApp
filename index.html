<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF9F3" />
    <script>
      // Apply the saved/OS theme before first paint: no light flash in dark
      // mode, and the phone status bar matches from the start.
      (function () {
        try {
          var t = localStorage.getItem("ledger:theme:v1");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
          document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#14181A" : "#FAF9F3");
        } catch (e) {}
      })();
    </script>

    <!-- iOS: opens full-screen from the home screen instead of as a Safari tab -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CHOUMCHOUM" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>CHOUMCHOUM — Your personal ledger</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
